<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms & Inputs</title>
  </head>
  <body>
    <button id="theme-toggle" type="button">Toggle theme</button>
    <button id="sidebar-toggle" type="button">Open sidebar</button>
    <aside data-sidebar>
      <a href="/index.html">Home</a>
      <a href="/buttons.html">Buttons</a>
      <a href="/windows.html">Windows</a>
    </aside>

    <h1>Forms & Inputs</h1>
    <form id="demo-form">
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" type="text" />
      <br />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <br />
      <button id="submit-form" type="submit">Submit</button>
      <button id="reset-form" type="reset">Reset</button>
    </form>
    <p id="form-output">Form not submitted</p>

    <script>
      const form = document.getElementById('demo-form');
      const output = document.getElementById('form-output');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = document.getElementById('full-name').value;
        const email = document.getElementById('email').value;
        output.textContent = 'Submitted: ' + name + ' | ' + email;
      });
      document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    </script>
  </body>
</html>
