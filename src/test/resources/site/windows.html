<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows & Tabs</title>
  </head>
  <body>
    <button id="theme-toggle" type="button">Toggle theme</button>
    <button id="sidebar-toggle" type="button">Open sidebar</button>
    <aside data-sidebar>
      <a href="/index.html">Home</a>
      <a href="/forms.html">Forms</a>
      <a href="/buttons.html">Buttons</a>
    </aside>

    <h1>Windows & Tabs</h1>
    <button id="open-window-btn" type="button">Open popup</button>

    <script>
      document.getElementById('open-window-btn').addEventListener('click', () => {
        window.open('/popup.html', '_blank', 'noopener');
      });
      document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    </script>
  </body>
</html>
